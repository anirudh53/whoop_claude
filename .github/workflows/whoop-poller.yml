name: Whoop Poller

on:
  schedule:
    # Runs every 30 minutes. GitHub's scheduler can lag a few minutes under
    # load, but this is free and requires no server.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run poller
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: python whoop_poller.py
